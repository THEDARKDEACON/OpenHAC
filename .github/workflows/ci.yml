name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check openhac tests

      - name: Mypy (core + placement) FAB-050
        run: mypy openhac/core openhac/compiler/pcb_placement.py openhac/compiler/layout_gen.py --ignore-missing-imports --follow-imports=silent --no-error-summary


      - name: Verify package version vs pyproject (SW-004)
        run: python scripts/verify_openhac_version.py

      - name: Scan docs for stale version tokens (SW-004)
        run: python scripts/check_release_strings.py

      - name: Changelog section matches pyproject version (SW-004)
        run: python scripts/check_changelog_version.py

      - name: Pytest (FAB-050 offline)
        env:
          OPENHAC_NO_NETWORK: "1"
        run: pytest tests/ -q --tb=short

  # KiCad CLI schematic ERC on a generated design (SCH-003). Blocks merges if KiCad reports ERC errors.
  kicad-schematic-erc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install KiCad (kicad-cli)
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y kicad

      - name: Install OpenHaC for system Python
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -e ".[dev]"

      - name: Golden schematic ERC (SCH-003)
        env:
          KICAD_FOOTPRINT_DIR: /usr/share/kicad/footprints
          KICAD9_SYMBOL_DIR: /usr/share/kicad/symbols
          OPENHAC_NO_NETWORK: "1"
        run: python3 scripts/ci_kicad_sch_erc_golden.py

  # KiCad pcbnew + full layout (system python3). Blocking (FAB-050 / SW-006).
  kicad-layout-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install KiCad (footprints + pcbnew Python bindings)
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y kicad

      - name: Install OpenHaC for system Python
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -e ".[dev]"

      - name: Full compile with layout (SW-006)
        env:
          KICAD_FOOTPRINT_DIR: /usr/share/kicad/footprints
          OPENHAC_NO_NETWORK: "1"
        run: python3 scripts/ci_full_compile_smoke.py

  # FAB-051 / FAB-031: place + optional Gerber zip (blocking).
  kicad-fab-golden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install KiCad
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y kicad

      - name: Install OpenHaC for system Python
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -e ".[dev]"

      - name: Fab gate validation (golden + negatives)
        env:
          KICAD_FOOTPRINT_DIR: /usr/share/kicad/footprints
          OPENHAC_NO_NETWORK: "1"
        run: python3 scripts/ci_validate_fab_gates.py --require-layout
